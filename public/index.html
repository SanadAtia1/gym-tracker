<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gym tracker!</title>
</head>
<body>
    
    <li class="exercise-list"></li> <br>
    <li class="sess-log-list"></li>

    <label for="day">View exercises by day:</label>
    <select id="day-select" name="day">
        <option value="1">Day 1</option>
        <option value="2">Day 2</option>
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
        <option value="6">Day 6</option>
      </select>
    <button type="button" class="submit-day-btn">Go</button> <br><br>

    <label for="sess-date">View session on:</label>
    <input type="date" id="sess-date" name="sess-date">
    <button type="button" class="submit-date-btn">Go</button> <br>

      <!-- things to add
       1. figure out how the ux should update when new logs r created
       2. 2 query sess delete check if no logs for sess
       3. change else in viewsess to show del btn if no logs or add logs
       4. make session get route return day so old sessions can access getDays
       5. make backend send back sess id for dup sess to create new logs
       6. wire up dup sess process to reroute back to getdays creation process
       7. second query in session post check if sess + day exists -->

    <script>
        const dayButton = document.querySelector('.submit-day-btn');
        const sessButton = document.querySelector('.submit-date-btn');
        const dayList = document.querySelector('.exercise-list');
        const logList = document.querySelector('.sess-log-list');
        const inputDay = document.querySelector('#day-select');
        const inputDate = document.querySelector('#sess-date');
        let sessionID;

        dayButton.addEventListener('click', () => {
            const value = inputDay.value;
            async function getDays(url, displayLogVals) {
                const response = await fetch(url);
                const data = await response.json();
                dayList.innerHTML = '';
                data.forEach(day => {
                    if (!displayLogVals) {
                        const li = document.createElement('li');
                        li.textContent = day.exercise;
                        dayList.appendChild(li); 
                    } else {
                        const li = logExercise(day);
                        dayList.appendChild(li);

                    }
                });
            }
            getDays(`/days/${value}`, false);

            function logExercise (day) {
                const li = document.createElement('li');
                const span = document.createElement('span');
                if (!day.weight || !day.reps) {
                    day.weight = 0;
                    day.reps = 0;
                }
                span.innerHTML = `${day.exercise} ( Previous: ${day.weight} lbs x ${day.reps} reps ) <br>
                <input type = 'number' class = 'new-weight-input'> lbs x 
                <input type = 'number' class = 'new-reps-input'> reps`;
                li.appendChild(span);
                const newWeight = li.querySelector('.new-weight-input');
                const newReps = li.querySelector('.new-reps-input');

                const logBtn = document.createElement('button');
                logBtn.textContent = 'Log';
                logBtn.className = 'new-log-btn';
                span.appendChild(logBtn);
                logBtn.addEventListener('click', () => {
                    async function newLog(url) {
                        const response = await fetch(url, {
                            method: 'POST', 
                            headers: {
                                'Content-Type': 'application/json' 
                            },
                            body: JSON.stringify({ sessionID: sessionID, exerciseID: day.exercise_id, weight: newWeight.value, reps: newReps.value})
                        });
                        const data = await response.json();
                        
                        console.log(data);
                    }
                    newLog(`/logs`);
                    span.innerHTML = `${day.exercise} - ${newWeight.value} lbs x ${newReps.value} reps`
                });

                return li;
            }

            if (!document.getElementById('create-sess-btn')) {
                const createSession = document.createElement('button');
                createSession.textContent = 'Create new session';
                createSession.id = 'create-sess-btn'; 
                document.body.appendChild(createSession);

                createSession.addEventListener('click', () => {
                    async function newSession(url) {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ day: value }) 
                        });
                        const data = await response.json();
                        sessionID = data;
                        console.log(sessionID);
                        getDays(`/days/${value}`, true);
                    }

                    newSession(`/sessions`);
                    createSession.remove();
                });
            }
        });

        sessButton.addEventListener('click', () => {
            const value = inputDate.value;
            async function getLogs(url) {
                const response = await fetch(url);
                const data = await response.json();
                if (data.length > 0) {
                    logList.innerHTML = '';
                    data.forEach(log => {
                        const li = document.createElement('li');
                        const span = document.createElement('span');
                        span.textContent = `${log.exercise}: ${log.weight} lbs x ${log.reps} reps`;
                        li.appendChild(span);

                        let inputsCreated = false;
                        const editBtn = document.createElement('button');
                        editBtn.textContent = 'Edit';
                        editBtn.className = 'edit-log-btn';
                        li.appendChild(editBtn);

                        editBtn.addEventListener('click', () => {
                            editBtn.style.display = 'none';
                            deleteBtn.style.display = 'none';
                            if (!inputsCreated) {
                                const span2 = document.createElement('span');
                                span2.innerHTML = `<input type = 'number' class = 'updated-weight-input' value = ${log.weight}> lbs x 
                                <input type = 'number' class = 'updated-reps-input' value = ${log.reps}> reps`;
                                li.appendChild(span2);
                                const updatedWeight = li.querySelector('.updated-weight-input');
                                const updatedReps = li.querySelector('.updated-reps-input');
                                span.textContent = `${log.exercise}: `;
                                inputsCreated = true;

                                const saveBtn = document.createElement('button');
                                saveBtn.textContent = 'Save';
                                saveBtn.className = 'save-edit-btn';
                                span2.appendChild(saveBtn);
                                saveBtn.addEventListener('click', () => {
                                    async function updateLog(url) {
                                        const response = await fetch(url, {
                                            method: 'PATCH',
                                            headers: {
                                                'Content-Type': 'application/json'
                                            },
                                            body: JSON.stringify({ weight: updatedWeight.value, reps: updatedReps.value }) 
                                        });
                                        const data = await response.json();
                                        
                                        console.log(data.message);
                                        if (data.success) {
                                            if (updatedWeight.value) {log.weight = updatedWeight.value;}
                                            if (updatedReps.value) {log.reps = updatedReps.value;}
                                            span.textContent = `${log.exercise}: ${log.weight} lbs x ${log.reps} reps`;
                                            span2.remove();
                                            editBtn.style.display = 'inline-block';
                                            deleteBtn.style.display = 'inline-block';
                                            inputsCreated = false;
                                        } else {
                                           alert(data.message);
                                        }
                                    }

                                    updateLog(`/logs/${log.id}`)
                                });
                            
                                const cancelBtn = document.createElement('button');
                                cancelBtn.textContent = 'Cancel';
                                cancelBtn.className = 'cancel-edit-btn';
                                span2.appendChild(cancelBtn);
                                cancelBtn.addEventListener('click', () => {
                                    span.textContent = `${log.exercise}: ${log.weight} lbs x ${log.reps} reps`;
                                    span2.remove();
                                    editBtn.style.display = 'inline-block';
                                    deleteBtn.style.display = 'inline-block';
                                    inputsCreated = false;
                                });
                            }
                        });

                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.className = 'delete-log-btn';
                        li.appendChild(deleteBtn);

                        deleteBtn.addEventListener('click', () => {
                            async function delLog(url) {
                                const response = await fetch(url, {
                                    method: 'DELETE'
                                });
                                const data = await response.json();
                                li.innerHTML = data.message;
                            }
                            delLog(`/logs/${log.id}`);
                        });

                        logList.appendChild(li); 
                    });
                } else {
                    logList.innerHTML = 'No logs on this day'
                }
            }
            getLogs(`/sessions/${value}`);
        });
    </script>
    
</body>
</html>
