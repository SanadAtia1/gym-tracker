<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gym tracker!</title>
</head>
<body>
    
    <li class="exercise-list"></li>

    <label for="day">View exercises by day:</label>
    <input type="number" id="day" name="day" placeholder="Enter day">
    <button type="button" class="submit-choice-btn">Go</button>



    <script>
        const button = document.querySelector('.submit-choice-btn');
        const list = document.querySelector('.exercise-list');
        const input = document.querySelector('#day');

        async function getDays(url) {
            const response = await fetch(url);
            const data = await response.json();
            if (Array.isArray(data)) {
                list.innerHTML = "";
                data.forEach(day => {
                    const li = document.createElement("li");
                    li.textContent = day.exercise;
                    list.appendChild(li);
                });
            } else {
                list.innerHTML = data.message;
            }
        }

        button.addEventListener('click', () => {
            const value = input.value;
            if (value > 0 && value < 7) {
                getDays(`/days/${value}`);
            } else {
                list.innerHTML = "Error: invalid choice";
                return;
            }

        });
    </script>
    
</body>
</html>
