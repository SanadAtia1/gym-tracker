<!DOCTYPE html>
<html lang="en">
<head>
    <title>Gym tracker!</title>
</head>
<body>
    
    <li class="exercise-list"></li> <br>
    <li class="sess-log-list"></li>

    <label for="day">View exercises by day:</label>
    <select id="day-select" name="day">
        <option value="1">Day 1</option>
        <option value="2">Day 2</option>
        <option value="3">Day 3</option>
        <option value="4">Day 4</option>
        <option value="5">Day 5</option>
        <option value="6">Day 6</option>
      </select>
    <button type="button" class="submit-day-btn">Go</button> <br><br>

    <label for="sess-date">View session on:</label>
    <input type="date" id="sess-date" name="sess-date">
    <button type="button" class="submit-date-btn">Go</button> <br>



    <script>
        const dayButton = document.querySelector('.submit-day-btn');
        const sessButton = document.querySelector('.submit-date-btn');
        const dayList = document.querySelector('.exercise-list');
        const logList = document.querySelector('.sess-log-list');
        const inputDay = document.querySelector('#day-select');
        const inputDate = document.querySelector('#sess-date');
        let sessionID;

        dayButton.addEventListener('click', () => {
            const value = inputDay.value;
            async function getDays(url) {
                const response = await fetch(url);
                const data = await response.json();
                if (Array.isArray(data)) {
                    dayList.innerHTML = '';
                    data.forEach(day => {
                        const li = document.createElement('li');
                        li.textContent = day.exercise;
                        dayList.appendChild(li); 
                    });
                } 
            }
            getDays(`/days/${value}`);

            if (!document.getElementById('create-sess-btn')) {
                const createSession = document.createElement('button');
                createSession.textContent = 'Create new session';
                createSession.id = 'create-sess-btn'; 
                document.body.appendChild(createSession);

                createSession.addEventListener('click', () => {
                    async function newSession(url) {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ day: value }) 
                        });
                        const data = await response.json();
                        sessionID = data;
                        console.log(sessionID);
                    }

                    newSession(`/sessions`);
                });
            }
        });

        sessButton.addEventListener('click', () => {
            const value = inputDate.value;
            async function getLogs(url) {
                const response = await fetch(url);
                const data = await response.json();
                if (data.length > 0) {
                    logList.innerHTML = '';
                    data.forEach(log => {
                        const li = document.createElement('li');
                        const span = document.createElement('span');
                        span.textContent = `${log.exercise}: ${log.weight} lbs x ${log.reps} reps`;
                        li.appendChild(span);

                        let inputsCreated = false;
                        const editBtn = document.createElement('button');
                        editBtn.textContent = 'Edit';
                        editBtn.className = 'edit-log-btn';
                        li.appendChild(editBtn);

                        editBtn.addEventListener('click', () => {
                            if (!inputsCreated) {
                                const updtedWeight = document.createElement('input');
                                updtedWeight.type = 'number';
                                updtedWeight.value = log.weight;
                                const updtedReps = document.createElement('input');
                                updtedReps.type = 'number';
                                updtedReps.value = log.reps;
                                li.appendChild(updtedWeight);
                                li.appendChild(updtedReps);
                                inputsCreated = true;

                                const saveBtn = document.createElement('button');
                                saveBtn.textContent = 'Save';
                                saveBtn.className = 'save-edit-btn';
                                li.appendChild(saveBtn);
                                saveBtn.addEventListener('click', () => {
                                    async function editLog(url) {
                                        const response = await fetch(url, {
                                            method: 'PATCH',
                                            headers: {
                                                'Content-Type': 'application/json'
                                            },
                                            body: JSON.stringify({ weight: updtedWeight.value, reps: updtedReps.value }) 
                                        });
                                        const data = await response.json();
                                        
                                        console.log(data.message);
                                        if (data.success) {
                                            if (updtedWeight.value) {log.weight = updtedWeight.value;}
                                            if (updtedReps.value) {log.reps = updtedReps.value;}
                                            span.textContent = `${log.exercise}: ${log.weight} lbs x ${log.reps} reps`;
                                            updtedWeight.remove();
                                            updtedReps.remove();
                                            saveBtn.remove();
                                            cancelBtn.remove();
                                            inputsCreated = false;
                                        } else {
                                           alert(data.message);
                                        }
                                    }

                                    editLog(`/logs/${log.id}`)
                                });
                            
                                const cancelBtn = document.createElement('button');
                                cancelBtn.textContent = 'Cancel';
                                cancelBtn.className = 'cancel-edit-btn';
                                li.appendChild(cancelBtn);
                                cancelBtn.addEventListener('click', () => {
                                    updtedWeight.remove();
                                    updtedReps.remove();
                                    saveBtn.remove();
                                    cancelBtn.remove();
                                    inputsCreated = false;
                                });
                            }
                        });

                        const deleteBtn = document.createElement('button');
                        deleteBtn.textContent = 'Delete';
                        deleteBtn.className = 'delete-log-btn';
                        li.appendChild(deleteBtn);

                        deleteBtn.addEventListener('click', () => {
                            async function delLog(url) {
                                const response = await fetch(url, {
                                    method: 'DELETE'
                                });
                                const data = await response.json();
                                li.innerHTML = data.message;
                            }
                            delLog(`/logs/${log.id}`);
                        });

                        logList.appendChild(li); 
                    });
                } else {
                    logList.innerHTML = 'No logs on this day'
                }
            }
            getLogs(`/sessions/${value}`);
        });
    </script>
    
</body>
</html>
